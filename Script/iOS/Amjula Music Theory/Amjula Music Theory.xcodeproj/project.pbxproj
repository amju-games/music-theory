			shellScript = "# 1. Define paths relative to the Project Directory\n# This ensures it works for everyone on the team\nTEMPLATE_PATH=\"$PROJECT_DIR/../../../Source/Version.h.template\"\nOUTPUT_PATH=\"$PROJECT_DIR/../../../Source/Version.h\"\n\n# 2. Extract version info from Xcode's internal variables\n# Xcode provides these automatically to the build phase\nVER=\"$MARKETING_VERSION ($CURRENT_PROJECT_VERSION)\"\n\n# 3. Parse the Version (1.2.3) into Major, Minor, Patch\n# We use 'cut' because it's more reliable in Xcode's shell\nMAJOR=$(echo $MARKETING_VERSION | cut -d. -f1)\nMINOR=$(echo $MARKETING_VERSION | cut -d. -f2)\nPATCH=$(echo $MARKETING_VERSION | cut -d. -f3)\nBUILD=$CURRENT_PROJECT_VERSION\n\n# Fallbacks if the version doesn't have 3 parts (e.g. \"1.0\")\nMAJOR=${MAJOR:-0}\nMINOR=${MINOR:-0}\nPATCH=${PATCH:-0}\n\n# 4. Generate the header\nif [ -f \"$TEMPLATE_PATH\" ]; then\n    echo \"Generating Version.h at $OUTPUT_PATH\"\n    sed -e \"s/VERSION_TOKEN/$VER/g\" \\\n        -e \"s/MAJOR_TOKEN/$MAJOR/g\" \\\n        -e \"s/MINOR_TOKEN/$MINOR/g\" \\\n        -e \"s/PATCH_TOKEN/$PATCH/g\" \\\n        -e \"s/BUILD_TOKEN/$BUILD/g\" \\\n        \"$TEMPLATE_PATH\" > \"$OUTPUT_PATH\"\nelse\n    echo \"error: Version.h.template not found at $TEMPLATE_PATH\"\n    exit 1\nfi\n";
